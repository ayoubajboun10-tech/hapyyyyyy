<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02050a">
<title>Khadija — The Magical Journey</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/scenes.css">
<link rel="stylesheet" href="css/diary.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header id="top">
  <div id="chap"><small id="chapNum"></small><span id="chapTitle"></span></div>
  <div class="tools">
    <button class="chip" id="btnSound" aria-pressed="false"></button>
    <button class="chip" id="btnDiary"></button>
    <button class="chip" id="btnMenu" aria-haspopup="dialog"></button>
  </div>
</header>
<nav id="side" aria-label="Chapters"></nav>
<main id="stage"><div id="world"></div></main>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="veil" aria-hidden="true"><div id="veilCard"></div></div>
<aside id="menu" class="panel" hidden role="dialog" aria-modal="true"></aside>
<div id="diary" class="overlay" hidden></div>
<div id="letter" class="overlay" hidden></div>
<div id="cursor" aria-hidden="true"></div>
<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff">This story needs JavaScript.</p></noscript>
<script src="data/config.js"></script>
<script src="js/util.js"></script>
<script src="js/audio.js"></script>
<script src="js/transitions.js"></script>
<script src="js/camera.js"></script>
<script src="js/dialogue.js"></script>
<script src="js/diary.js"></script>
<script src="js/scenes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
